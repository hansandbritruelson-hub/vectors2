[package]
name = "renderer-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ttf-parser = "0.20"
resvg = "0.29.0"
tiny-skia = "0.8.4"
usvg = "0.29.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
guillotiere = "0.6.2"
[dependencies.wasm-bindgen-futures]
version = "0.4"
