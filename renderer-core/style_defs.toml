# Style Definitions — Single Source of Truth
# This file defines all CSS property IDs, control markers, and unit IDs.
# build.rs reads this and generates:
#   - $OUT_DIR/style_constants.rs  (Rust consts)
#   - $OUT_DIR/style_constants.wgsl (WGSL consts)
#
# Property comments describe the byte layout AFTER the prop_id u32.

[properties]
# background_color_rgba = 1   →  [r:f32] [g:f32] [b:f32] [a:f32]
background_color_rgba = 1
# width = 2                   →  [value:f32] [unit:u32]
width = 2
# height = 3                  →  [value:f32] [unit:u32]
height = 3
# flex_direction = 4          →  [value:u32]  (0=row, 1=column)
flex_direction = 4
# position_mode = 5           →  [value:u32]  (0=relative, 1=absolute)
position_mode = 5
# top = 6                     →  [value:f32] [unit:u32]
top = 6
# left = 7                    →  [value:f32] [unit:u32]
left = 7
# z_index = 8                 →  [value:f32]
z_index = 8

# padding_top = 9             →  [value:f32] [unit:u32]
padding_top = 9
# padding_right = 10           →  [value:f32] [unit:u32]
padding_right = 10
# padding_bottom = 11          →  [value:f32] [unit:u32]
padding_bottom = 11
# padding_left = 12            →  [value:f32] [unit:u32]
padding_left = 12

# margin_top = 13              →  [value:f32] [unit:u32]
margin_top = 13
# margin_right = 14            →  [value:f32] [unit:u32]
margin_right = 14
# margin_bottom = 15           →  [value:f32] [unit:u32]
margin_bottom = 15
# margin_left = 16             →  [value:f32] [unit:u32]
margin_left = 16

# border_top_width = 17        →  [value:f32] [unit:u32]
border_top_width = 17
# border_right_width = 18      →  [value:f32] [unit:u32]
border_right_width = 18
# border_bottom_width = 19     →  [value:f32] [unit:u32]
border_bottom_width = 19
# border_left_width = 20       →  [value:f32] [unit:u32]
border_left_width = 20
# border_color_top = 21        →  [packed_rgba:u32]
border_color_top = 21
# border_color_right = 22      →  [packed_rgba:u32]
border_color_right = 22
# border_color_bottom = 23     →  [packed_rgba:u32]
border_color_bottom = 23
# border_color_left = 24       →  [packed_rgba:u32]
border_color_left = 24

# outline_width = 25           →  [value:f32] [unit:u32]
outline_width = 25
# outline_offset = 26          →  [value:f32] [unit:u32]
outline_offset = 26
# outline_color_top = 27       →  [packed_rgba:u32]
outline_color_top = 27
# outline_color_right = 28     →  [packed_rgba:u32]
outline_color_right = 28
# outline_color_bottom = 29    →  [packed_rgba:u32]
outline_color_bottom = 29
# outline_color_left = 30      →  [packed_rgba:u32]
outline_color_left = 30

# box_shadow_h_offset = 31     →  [value:f32] [unit:u32]
box_shadow_h_offset = 31
# box_shadow_v_offset = 32     →  [value:f32] [unit:u32]
box_shadow_v_offset = 32
# box_shadow_blur = 33         →  [value:f32] [unit:u32]
box_shadow_blur = 33
# box_shadow_spread = 34       →  [value:f32] [unit:u32]
box_shadow_spread = 34
# box_shadow_color = 35        →  [packed_rgba:u32]
box_shadow_color = 35
# text_color_rgba = 36         →  [r:f32] [g:f32] [b:f32] [a:f32]
text_color_rgba = 36
# font_size = 37               →  [value:f32] [unit:u32]
font_size = 37
# fill_color = 38              →  [packed_rgba:u32]
fill_color = 38
# stroke_color = 39            →  [packed_rgba:u32]
stroke_color = 39
# stroke_width = 40            →  [value:f32] [unit:u32]
stroke_width = 40
# justify_content = 41         →  [value:u32]
# 0=flex-start, 1=center, 2=flex-end, 3=space-between, 4=space-around, 5=space-evenly
justify_content = 41
# align_items = 42             →  [value:u32]
# 0=stretch, 1=flex-start, 2=center, 3=flex-end
align_items = 42
# text_align = 43             →  [value:u32]
# 0=left/start, 1=center, 2=right/end
text_align = 43
# line_height = 44            →  [value:f32]
# multiplier against font metrics line height
line_height = 44
# letter_spacing = 45         →  [value:f32] [unit:u32]
letter_spacing = 45
# word_spacing = 46           →  [value:f32] [unit:u32]
word_spacing = 46
# font_weight = 47            →  [value:u32]
# numeric CSS-like weight (100..900)
font_weight = 47
# font_style = 48             →  [value:u32]
# 0=normal, 1=italic, 2=oblique
font_style = 48
# min_width = 49             →  [value:f32] [unit:u32]
min_width = 49
# max_width = 50             →  [value:f32] [unit:u32]
max_width = 50
# min_height = 51            →  [value:f32] [unit:u32]
min_height = 51
# max_height = 52            →  [value:f32] [unit:u32]
max_height = 52

[controls]
# CTRL_END terminates a class definition in class_defs buffer
end = 4294967295
# CTRL_HOVER_START delineates hover styles within a class
hover_start = 4294967294

[units]
px = 1
percent = 2
em = 3
vh = 4
vw = 5
