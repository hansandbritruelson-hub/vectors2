# Style Definitions — Single Source of Truth
# This file defines all CSS property IDs, control markers, and unit IDs.
# build.rs reads this and generates:
#   - $OUT_DIR/style_constants.rs  (Rust consts)
#   - $OUT_DIR/style_constants.wgsl (WGSL consts)
#
# Property comments describe the byte layout AFTER the prop_id u32.

[properties]
# background_color_rgba = 1   →  [r:f32] [g:f32] [b:f32] [a:f32]
background_color_rgba = 1
# width = 2                   →  [value:f32] [unit:u32]
width = 2
# height = 3                  →  [value:f32] [unit:u32]
height = 3
# flex_direction = 4          →  [value:u32]  (0=row, 1=column)
flex_direction = 4
# position_mode = 5           →  [value:u32]  (0=relative, 1=absolute)
position_mode = 5
# top = 6                     →  [value:f32] [unit:u32]
top = 6
# left = 7                    →  [value:f32] [unit:u32]
left = 7
# z_index = 8                 →  [value:f32]
z_index = 8

# padding_top = 9             →  [value:f32] [unit:u32]
padding_top = 9
# padding_right = 10           →  [value:f32] [unit:u32]
padding_right = 10
# padding_bottom = 11          →  [value:f32] [unit:u32]
padding_bottom = 11
# padding_left = 12            →  [value:f32] [unit:u32]
padding_left = 12

# margin_top = 13              →  [value:f32] [unit:u32]
margin_top = 13
# margin_right = 14            →  [value:f32] [unit:u32]
margin_right = 14
# margin_bottom = 15           →  [value:f32] [unit:u32]
margin_bottom = 15
# margin_left = 16             →  [value:f32] [unit:u32]
margin_left = 16

# border_top_width = 17        →  [value:f32] [unit:u32]
border_top_width = 17
# border_right_width = 18      →  [value:f32] [unit:u32]
border_right_width = 18
# border_bottom_width = 19     →  [value:f32] [unit:u32]
border_bottom_width = 19
# border_left_width = 20       →  [value:f32] [unit:u32]
border_left_width = 20
# border_color_top = 21        →  [packed_rgba:u32]
border_color_top = 21
# border_color_right = 22      →  [packed_rgba:u32]
border_color_right = 22
# border_color_bottom = 23     →  [packed_rgba:u32]
border_color_bottom = 23
# border_color_left = 24       →  [packed_rgba:u32]
border_color_left = 24

# outline_width = 25           →  [value:f32] [unit:u32]
outline_width = 25
# outline_offset = 26          →  [value:f32] [unit:u32]
outline_offset = 26
# outline_color_top = 27       →  [packed_rgba:u32]
outline_color_top = 27
# outline_color_right = 28     →  [packed_rgba:u32]
outline_color_right = 28
# outline_color_bottom = 29    →  [packed_rgba:u32]
outline_color_bottom = 29
# outline_color_left = 30      →  [packed_rgba:u32]
outline_color_left = 30

[controls]
# CTRL_END terminates a class definition in class_defs buffer
end = 4294967295

[units]
px = 1
percent = 2
em = 3
vh = 4
vw = 5
